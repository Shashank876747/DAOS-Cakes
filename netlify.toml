[build]
  publish = "dist"
  command = "npm run build"

# Redirect all routing to index.html for SPA support
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom HTTP Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
